version: "3.8"

services:
  pezza-db:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/entelect-incubator/pezza-db:latest
    container_name: pezza-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pezza
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # Optional: Persist data across container restarts
      - pezza-data:/var/lib/postgresql/data
    networks:
      - pezza-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pezza"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pezza-data:
    driver: local

networks:
  pezza-network:
    driver: bridge
